<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c25e1a" />
  <title>Connected Project Analytics · CeoAgent</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="/vendor/lucide/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Page-specific additions on top of style.css's shared tokens/components.
       Device-breakdown categorical slots: fixed order (desktop/mobile/tablet),
       validated against this app's own --bg-raised card surface (3-slot
       all-pairs CVD pass in both light and dark — see dataviz skill palette). */
    .viz-root {
      --series-1: #2a78d6; /* desktop */
      --series-2: #eb6834; /* mobile */
      --series-3: #1baf7a; /* tablet */
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
      }
    }
    :root[data-theme="dark"] .viz-root {
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
    }

    .viz-page { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
    .viz-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
    .viz-title-group { flex: 1; min-width: 200px; }
    .viz-title { font-size: 22px; font-weight: 800; margin: 0; }
    .viz-subtitle { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 0; }
    .viz-range-group { display: flex; gap: 4px; background: var(--bg-alt); border-radius: var(--radius-xs); padding: 3px; }
    .viz-range-btn { border: none; background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 9px; cursor: pointer; }
    .viz-range-btn.active { background: var(--bg-raised); color: var(--text); }
    .viz-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-muted); cursor: pointer; }
    .viz-icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .viz-icon-btn svg { width: 15px; height: 15px; }

    .viz-section { margin-top: 28px; }
    .viz-section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }

    .delta { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
    .delta.up { color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
    .delta.down { color: var(--error); background: color-mix(in srgb, var(--error) 14%, transparent); }
    .delta.flat { color: var(--text-muted); background: var(--bg-alt); }
    .stat-tile-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .chart-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .chart-wrap { position: relative; }
    .chart-tooltip {
      position: absolute; pointer-events: none; background: var(--text); color: var(--bg-raised);
      font-size: 11.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -115%);
      opacity: 0; transition: opacity 0.1s; z-index: 5; font-weight: 600;
    }
    .chart-tooltip.show { opacity: 1; }
    .chart-tooltip .ct-value { font-size: 13px; }
    .chart-tooltip .ct-date { color: color-mix(in srgb, var(--bg-raised) 70%, transparent); font-weight: 500; }

    .funnel-row { margin-bottom: 10px; }
    .funnel-row-head { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
    .funnel-row-label { font-weight: 600; }
    .funnel-row-meta { color: var(--text-muted); }
    .funnel-track { height: 14px; background: var(--bg-alt); border-radius: 999px; overflow: hidden; }
    .funnel-fill { height: 100%; background: var(--accent); border-radius: 999px; }

    .device-track { display: flex; height: 22px; border-radius: 999px; overflow: hidden; background: var(--bg-alt); }
    .device-seg + .device-seg { margin-left: 2px; }
    .device-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
    .device-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .device-legend-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .device-legend-label { font-weight: 600; text-transform: capitalize; }
    .device-legend-meta { color: var(--text-muted); }

    .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .rank-row:last-child { border-bottom: none; }
    .rank-label { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-bar-track { flex: 1.3; min-width: 60px; height: 8px; background: var(--bg-alt); border-radius: 999px; overflow: hidden; }
    .rank-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
    .rank-value { font-size: 12px; color: var(--text-muted); flex-shrink: 0; width: 70px; text-align: right; }

    .heatmap-scroll { overflow-x: auto; }
    .heatmap-grid { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; min-width: 620px; }
    .heatmap-hour-label { font-size: 9px; color: var(--text-faint); text-align: center; }
    .heatmap-day-label { font-size: 10.5px; color: var(--text-muted); display: flex; align-items: center; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 3px; background: var(--accent); }

    .table-toggle-btn { font-size: 11px; color: var(--accent); font-weight: 600; background: none; border: none; cursor: pointer; padding: 0; }
    .viz-sr-table { margin-top: 10px; width: 100%; border-collapse: collapse; font-size: 12px; }
    .viz-sr-table th, .viz-sr-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); }
    .viz-sr-table th { color: var(--text); font-weight: 700; }
  </style>
</head>
<body>
  <div id="app" class="viz-root viz-page"><div class="stub-placeholder">Loading…</div></div>
  <script src="external-analytics.js"></script>
</body>
</html>
