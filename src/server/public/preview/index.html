<html lang="en">

  <title>CeoAgent</title>

<body>

       (many randomized flowing lines rather than a handful of hand-placed
       ones). See .aurora-streaks-svg etc. in style.css for
       positioning/theming/animation. Runs before #app exists; it inserts
       its own <svg> as <body>'s first child once it's built. -->
  <script src="aurora-bg.js"></script>
  <div id="app"></div>
  <script src="metallic-bot.js"></script>
